# Pin versions to match your working setup:
#   source figfirst_env/bin/activate && pip freeze
name: flutter-figures
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib
  - jupyter
  - nbconvert
  - nbstripout
  - cairosvg
  - pip
  - pip:
      - figurefirst
      - rosbags
      - -e .
